name: Build and Push Base Image

on:
  push:
    tags:
      - 'base-v*'

env:
  REGISTRY: ghcr.io
  BASE_IMAGE: ${{ github.repository_owner }}/znuny-base

jobs:
  migration-acceptance:
    uses: ./.github/workflows/migration-checks.yml
    with:
      candidate-base: true
    permissions:
      contents: read

  build-and-push:
    name: Build & Push base
    needs: migration-acceptance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # ----------------------------------------------------------------
      # 1. Checkout
      # ----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # ----------------------------------------------------------------
      # 2. Derive the base version from the git tag (base-v2.0 → 2.0)
      #    and make sure it matches the FROM line of the Znuny image
      # ----------------------------------------------------------------
      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#base-v}"
          FROM_LINE="FROM ${REGISTRY}/${BASE_IMAGE}:${VERSION}"
          if ! grep -qx "${FROM_LINE}" znuny/Dockerfile; then
            echo "::error::znuny/Dockerfile does not contain '${FROM_LINE}'"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------
      # 3. Set up Docker Buildx
      # ----------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ----------------------------------------------------------------
      # 4. Log in to GitHub Container Registry
      # ----------------------------------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------
      # 5. Build & push — base image (the source label links the
      #    package to this repository)
      # ----------------------------------------------------------------
      - name: Build and push base image
        uses: docker/build-push-action@v7
        with:
          context: ./znuny
          file: ./znuny/Dockerfile.base
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.BASE_IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=znuny-base
            org.opencontainers.image.description=Debian 13 base with the Perl dependencies of Znuny
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Image summary
        run: |
          echo "### Published base image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${REGISTRY}/${BASE_IMAGE}:${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
