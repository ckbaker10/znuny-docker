name: Build and Push Docker Images

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  ZNUNY_IMAGE: ${{ github.repository_owner }}/znuny

jobs:
  migration-acceptance:
    uses: ./.github/workflows/migration-checks.yml
    with:
      version: ${{ github.ref_name }}
    permissions:
      contents: read

  build-and-push:
    name: Build & Push
    needs: migration-acceptance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # ----------------------------------------------------------------
      # 1. Checkout
      # ----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # ----------------------------------------------------------------
      # 2. Derive the Znuny version from the git tag (v7.2.1 → 7.2.1)
      # ----------------------------------------------------------------
      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. v7.2.1
          VERSION="${TAG#v}"                # strip leading 'v'
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------
      # 3. Set up Docker Buildx
      # ----------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ----------------------------------------------------------------
      # 5. Log in to GitHub Container Registry
      # ----------------------------------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------
      # 6. Generate OCI labels — Znuny image
      # ----------------------------------------------------------------
      - name: Docker metadata — Znuny
        id: meta-znuny
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.ZNUNY_IMAGE }}
          # Tags are intentionally NOT set here — we build them explicitly
          # in the build step to guarantee both version and latest are applied.
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=Znuny
            org.opencontainers.image.description=Znuny ${{ steps.version.outputs.version }} on Debian 13
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      # ----------------------------------------------------------------
      # 7. Build & push — Znuny image
      # ----------------------------------------------------------------
      - name: Build and push Znuny image
        uses: docker/build-push-action@v7
        with:
          context: ./znuny
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ZNUNY_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.ZNUNY_IMAGE }}:latest
          labels: ${{ steps.meta-znuny.outputs.labels }}
          build-args: |
            ZNUNY_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------------------------------
      # 8. Output the image digest for verification
      # ----------------------------------------------------------------
      - name: Image digest summary
        run: |
          {
            echo "### Published image"
            echo ""
            echo "| Image | Tags |"
            echo "|---|---|"
            echo "| \`${{ env.REGISTRY }}/${{ env.ZNUNY_IMAGE }}\` | \`${{ steps.version.outputs.version }}\`, \`latest\` |"
          } >> "$GITHUB_STEP_SUMMARY"
